name: Build QuandEX Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "QuandEX_Android_v1.50_Source.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Extraire les sources QuandEX
        run: |
          mkdir -p workspace
          unzip -q QuandEX_Android_v1.50_Source.zip -d workspace
          test -f workspace/QuandEX-Android/settings.gradle.kts

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tester et compiler l’APK debug
        working-directory: workspace/QuandEX-Android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Préparer l’APK QuandEX
        run: |
          mkdir -p dist
          cp workspace/QuandEX-Android/app/build/outputs/apk/debug/app-debug.apk dist/QuandEX-Mobile-v1.50.1-debug.apk

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: QuandEX-Mobile-v1.50.1-APK
          path: dist/QuandEX-Mobile-v1.50.1-debug.apk
          if-no-files-found: error
          retention-days: 30
